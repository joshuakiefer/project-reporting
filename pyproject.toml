[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "workoptimize"
version = "0.1.0"
description = "AI-powered work optimization assistant that watches your screen and suggests improvements"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "anthropic>=0.39.0",
    "Pillow>=10.0.0",
    "cryptography>=41.0.0",
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
workoptimize = "workoptimize.__main__:main"

[tool.setuptools.packages.find]
include = ["workoptimize*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
