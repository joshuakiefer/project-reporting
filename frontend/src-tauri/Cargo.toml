[package]
name = "workoptimize"
version = "0.1.0"
description = "WorkOptimize AI — Secure Work Optimization Assistant"
authors = ["WorkOptimize"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
